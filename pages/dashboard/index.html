<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>运行信息 · 真实读数</title>
<style>
:root{
  --bg:#f4f4f7; --bg-glow:rgba(52,130,255,.10);
  --card:#ffffff; --card-alt:#f1f1f4; --card-hover:#fafafd;
  --text:#17171a; --text-2:#8b8b93; --text-3:#b4b4bc;
  --line:rgba(0,0,0,.055); --shadow:0 2px 18px rgba(20,20,40,.035);
  --accent:#3482ff; --accent-2:#6aa6ff; --accent-soft:rgba(52,130,255,.12);
  --track:rgba(0,0,0,.075); --thumb:#ffffff;
  --good:#34a853; --warn:#ff9f0a;
  --radius:22px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --bg-glow:rgba(52,130,255,.13);
    --card:#1b1b1d; --card-alt:#272729; --card-hover:#232326;
    --text:#f3f3f6; --text-2:#92929a; --text-3:#6c6c74;
    --line:rgba(255,255,255,.075); --shadow:0 2px 18px rgba(0,0,0,.4);
    --accent:#4d95ff; --accent-2:#7fb2ff; --accent-soft:rgba(77,149,255,.16);
    --track:rgba(255,255,255,.10); --thumb:#f7f7fa;
    --good:#4ac26b; --warn:#ffb340;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --bg-glow:rgba(52,130,255,.13);
  --card:#1b1b1d; --card-alt:#272729; --card-hover:#232326;
  --text:#f3f3f6; --text-2:#92929a; --text-3:#6c6c74;
  --line:rgba(255,255,255,.075); --shadow:0 2px 18px rgba(0,0,0,.4);
  --accent:#4d95ff; --accent-2:#7fb2ff; --accent-soft:rgba(77,149,255,.16);
  --track:rgba(255,255,255,.10); --thumb:#f7f7fa;
  --good:#4ac26b; --warn:#ffb340;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100vh;
  background-image:radial-gradient(900px 420px at 78% -12%,var(--bg-glow),transparent 70%);
  background-attachment:fixed;
}
.wrap{max-width:1000px;margin:0 auto;padding:34px 22px 64px}

/* ---------- Top bar ---------- */
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:26px}
.title-block h1{margin:0;font-size:36px;font-weight:650;letter-spacing:-.6px;line-height:1.2}
.title-block p{margin:6px 0 0;color:var(--text-2);font-size:14px}
.tools{display:flex;align-items:center;gap:8px;flex-shrink:0;padding-top:4px}
.chip{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;
  border-radius:999px;background:var(--card);box-shadow:var(--shadow);
  font-size:12.5px;color:var(--text-2);white-space:nowrap;
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.demo .dot{background:var(--warn)}
.chip.err .dot{background:#ff5b5b}
.icon-btn{
  width:34px;height:34px;border:0;border-radius:50%;background:var(--card);
  box-shadow:var(--shadow);color:var(--text-2);cursor:pointer;
  display:grid;place-items:center;transition:transform .18s,background .18s,color .18s;
}
.icon-btn:hover{transform:translateY(-1px);color:var(--accent);background:var(--card-hover)}
.icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.spin svg{animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Group title ---------- */
.group{margin-top:26px}
.group-title{
  margin:0 0 10px 4px;font-size:12.5px;font-weight:600;color:var(--text-2);
  letter-spacing:.3px;display:flex;align-items:center;justify-content:space-between;
}
.group-title .hint{font-weight:400;color:var(--text-3);font-size:11.5px;letter-spacing:0}

/* ---------- Card ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card.pad{padding:20px 22px}

/* ---------- Segmented control ---------- */
.seg{display:inline-flex;background:var(--card-alt);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{
  border:0;background:transparent;color:var(--text-2);font-size:13px;
  padding:7px 17px;border-radius:999px;cursor:pointer;font-family:inherit;
  transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap;
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--card);color:var(--accent);font-weight:600;box-shadow:0 1px 6px rgba(0,0,0,.07)}
.ctrl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.select{
  height:38px;border:0;border-radius:999px;background:var(--card-alt);color:var(--text);
  padding:0 34px 0 15px;font-size:13px;font-family:inherit;cursor:pointer;max-width:270px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
.select:focus{outline:2px solid var(--accent-soft)}

/* ---------- Hero ---------- */
.hero{
  position:relative;overflow:hidden;color:#fff;border-radius:var(--radius);
  background:linear-gradient(122deg,#2f7cf5 0%,#3482ff 42%,#6aa6ff 100%);
  padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;
  box-shadow:0 8px 30px rgba(52,130,255,.22);
}
.hero::after{
  content:"";position:absolute;right:-70px;top:-110px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.20),transparent 68%);pointer-events:none;
}
.hero::before{
  content:"";position:absolute;left:38%;bottom:-140px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);pointer-events:none;
}
.hero-l,.hero-r{position:relative;z-index:1}
.hero-l{min-width:0}
.hero .kicker{font-size:12.5px;opacity:.82;letter-spacing:.4px;display:flex;align-items:center;gap:7px}
.hero .kicker svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.hero .model{font-size:27px;font-weight:650;letter-spacing:-.4px;margin:10px 0 12px;word-break:break-all;line-height:1.25}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.hero .meta span{
  font-size:11.5px;background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.18);
  padding:4px 10px;border-radius:999px;backdrop-filter:blur(6px);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ring-wrap{display:flex;align-items:center;gap:14px;flex-shrink:0}
.ring{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(255,255,255,.22)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-text{text-align:center;position:absolute;width:104px;margin-left:0}
.ring-num{font-size:23px;font-weight:650;line-height:1.1}
.ring-lab{font-size:11px;opacity:.8;margin-top:2px}
.ring-box{position:relative;display:grid;place-items:center}
.ring-side{font-size:11.5px;opacity:.86;max-width:150px;line-height:1.9;letter-spacing:.1px}

/* ---------- Token grid ---------- */
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tcell{padding:16px 18px 18px;background:var(--card);transition:background .18s}
.tcell:hover{background:var(--card-hover)}
.tcell .lab{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.tcell .lab i{width:8px;height:8px;border-radius:3px;background:var(--accent);display:inline-block}
.tcell .lab i.g{background:var(--track)}
.tcell .lab i.b{background:var(--accent-2)}
.tcell .lab i.y{background:var(--warn)}
.tcell .num{font-size:25px;font-weight:650;letter-spacing:-.6px;margin-top:8px;font-variant-numeric:tabular-nums}
.tcell .sub{font-size:11px;color:var(--text-3);margin-top:3px}
.card-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 20px;font-size:11.5px;color:var(--text-2)}
.card-foot b{color:var(--text);font-weight:600}

/* ---------- Cache / slider ---------- */
.cache-main{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.big-rate{font-size:38px;font-weight:650;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.big-rate small{font-size:16px;font-weight:500;margin-left:3px;color:var(--text-2)}
.big-lab{font-size:12.5px;color:var(--text-2);margin-top:7px}
.rate-side{font-size:12px;color:var(--text-2);text-align:right;line-height:1.8}
.rate-side b{color:var(--text);font-weight:600}
.slider{height:10px;border-radius:999px;background:var(--track);margin:18px 0 6px;position:relative}
.slider-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));position:relative;transition:width .6s ease;min-width:0}
.slider-fill .thumb{
  position:absolute;right:-9px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border-radius:50%;background:var(--thumb);
  border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 5px rgba(0,0,0,.16);
}
:root[data-theme="dark"] .slider-fill .thumb{border-color:rgba(255,255,255,.12)}
.mini-list{margin-top:14px;border-top:1px solid var(--line)}
.mini-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}
.mini-row:last-child{border-bottom:0;padding-bottom:0}
.mini-row .r-lab{color:var(--text-2)}
.mini-row .r-val{font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:11.5px;color:var(--text-3);line-height:1.75;padding:14px 0 0}

/* ---------- Two columns ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rank{padding:6px 20px 14px}
.rank-row{padding:13px 0;border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:0}
.rank-head{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.rank-name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%}
.rank-val{font-variant-numeric:tabular-nums;color:var(--text-2);font-size:12px;white-space:nowrap}
.rank-val b{color:var(--accent);font-weight:650;font-size:13px}
.rank-bar{height:6px;border-radius:999px;background:var(--track);margin-top:9px;overflow:hidden}
.rank-bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .6s ease}
.empty{padding:26px 20px;text-align:center;color:var(--text-3);font-size:12.5px}

/* ---------- Trend ---------- */
.trend{padding:18px 20px 14px}
.trend svg{width:100%;height:auto;display:block;overflow:visible}
.trend .axis{fill:var(--text-3);font-size:10px}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-2);margin-top:10px;flex-wrap:wrap}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* ---------- Recent ---------- */
.recent{padding:4px 20px 10px}
.rec-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rec-row:last-child{border-bottom:0}
.rec-time{font-size:11.5px;color:var(--text-3);width:132px;flex-shrink:0;font-variant-numeric:tabular-nums}
.rec-model{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec-tok{font-size:11.5px;color:var(--text-2);width:120px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.pill{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 10px;min-width:56px;text-align:center;flex-shrink:0;font-variant-numeric:tabular-nums}
.pill.low{color:var(--warn);background:rgba(255,159,10,.13)}

.footer{margin-top:30px;padding:0 4px;color:var(--text-3);font-size:11.5px;line-height:1.9}
.footer code{background:var(--card-alt);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Consolas,monospace;font-size:11px}

@media(max-width:780px){
  .wrap{padding:24px 14px 48px}
  .title-block h1{font-size:29px}
  .tgrid{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start;padding:22px}
  .ring-wrap{align-self:stretch;justify-content:space-between}
  .rate-side{text-align:left}
  .rec-time{width:88px}
  .rec-tok{display:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="title-block">
      <h1>运行信息</h1>
      <p>真实型号 · Token 用量 · 缓存命中</p>
    </div>
    <div class="tools">
      <span class="chip" id="status"><span class="dot"></span><span id="status-text">连接中…</span></span>
      <button class="icon-btn" id="theme-btn" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn" id="refresh-btn" title="刷新" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <div class="ctrl-row">
    <div class="seg" id="window-seg">
      <button data-w="24h">近 24 小时</button>
      <button data-w="today">今天</button>
      <button data-w="weekly">近 7 天</button>
      <button data-w="all" class="on">全部</button>
    </div>
    <select class="select" id="umo-select"><option value="">全部会话</option></select>
  </div>

  <div class="group" style="margin-top:18px">
    <div class="group-title">当前模型<span class="hint">型号由后台配置，会随会话切换</span></div>
    <div class="hero">
      <div class="hero-l">
        <div class="kicker">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>
          实际调用模型
        </div>
        <div class="model" id="hero-model">读取中…</div>
        <div class="meta" id="hero-meta"></div>
      </div>
      <div class="hero-r">
        <div class="ring-wrap">
          <div class="ring-box">
            <svg class="ring" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="50"/><circle class="fg" id="ring-fg" cx="60" cy="60" r="50" stroke-dasharray="314.16" stroke-dashoffset="314.16"/></svg>
            <div class="ring-text"><div class="ring-num" id="ring-num">—</div><div class="ring-lab">最近一次命中</div></div>
          </div>
          <div class="ring-side" id="ring-side"></div>
        </div>
      </div>
    </div>
  </div>

  <section class="group">
    <div class="group-title">本窗口用量<span class="hint" id="win-hint"></span></div>
    <div class="card">
      <div class="tgrid" id="token-grid"></div>
      <div class="card-foot" id="token-foot"></div>
    </div>
  </section>

  <section class="group">
    <div class="group-title">缓存命中<span class="hint">与 cost_control /cache 面板同口径</span></div>
    <div class="card pad">
      <div class="cache-main">
        <div>
          <div class="big-rate" id="big-rate">—</div>
          <div class="big-lab">真实缓存命中率 · 窗口全量</div>
        </div>
        <div class="rate-side" id="rate-side"></div>
      </div>
      <div class="slider"><div class="slider-fill" id="slider-fill" style="width:0%"><span class="thumb"></span></div></div>
      <div class="mini-list" id="mini-list"></div>
      <div class="note" id="cache-note"></div>
    </div>
  </section>

  <div class="cols">
    <section class="group">
      <div class="group-title">按模型<span class="hint">请求数 / 命中率</span></div>
      <div class="card rank" id="by-model"></div>
    </section>
    <section class="group">
      <div class="group-title">按会话<span class="hint">请求数 / 命中率</span></div>
      <div class="card rank" id="by-session"></div>
    </section>
  </div>

  <section class="group">
    <div class="group-title">每日 Token 趋势<span class="hint">灰=非缓存输入 · 蓝=缓存命中输入</span></div>
    <div class="card trend" id="trend"></div>
  </section>

  <section class="group">
    <div class="group-title">最近请求<span class="hint" id="recent-hint"></span></div>
    <div class="card recent" id="recent"></div>
  </section>

  <div class="footer" id="footer"></div>
</div>

const WIN_LABEL = {"24h":"近 24 小时","today":"今天","weekly":"近 7 天","7d":"近 7 天","all":"全部历史"};
let state = { window: "all", umo: "", data: null, demo: false, loading: false };

const $ = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat("zh-CN");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const num = (n) => nf.format(Number(n || 0));
const pct = (v) => (typeof v === "number" && v >= 0) ? v.toFixed(1) + "%" : "—";
const clamp = (v) => Math.max(0, Math.min(100, Number(v) || 0));

function unwrap(r){
  if(!r) return null;
  if(r.success === true && r.data && typeof r.data === "object") return r.data;
  if(r.status === "ok" && r.data && typeof r.data === "object") return r.data;
  if(typeof r.ok !== "undefined") return r;
  if(r.data && typeof r.data.ok !== "undefined") return r.data;
  return null;
}

async function fetchData(){
  const params = { window: state.window, umo: state.umo || "" };
  // 1) AstrBot Plugin Page bridge（父级 SPA 代发，自动带 JWT）
  const bridge = window.AstrBotPluginPage;
  if(bridge && typeof bridge.apiGet === "function"){
    try{
      const d = unwrap(await bridge.apiGet("stats", params));
      if(d && typeof d.ok !== "undefined") return { data: d, demo: false };
    }catch(e){ /* 落到同源 fetch */ }
    try{
      const d = unwrap(await bridge.apiGet("/" + PLUGIN + "/stats", params));
      if(d && typeof d.ok !== "undefined") return { data: d, demo: false };
    }catch(e){ /* 落到同源 fetch */ }
  }
  // 2) 已登录 WebUI 时同源直连
  try{
    const res = await fetch(API + "stats?" + new URLSearchParams(params), { credentials: "same-origin" });
    if(res.ok){
      const d = unwrap(await res.json());
      if(d && typeof d.ok !== "undefined") return { data: d, demo: false };
    }
  }catch(e){ /* 落到演示数据 */ }
  // 3) 本地预览 / 接口未就绪
  return { data: DEMO, demo: true };
}

function setStatus(text, kind){
  $("status-text").textContent = text;
  $("status").className = "chip" + (kind ? " " + kind : "");
}

function renderHero(d){
  const cur = d.current || {};
  const last = d.last || {};
  const model = cur.model || last.model || "暂时读不到";
  $("hero-model").textContent = model;
  const chips = [];
  if(cur.id) chips.push("供应商 " + cur.id);
  if(cur.type) chips.push("接口 " + cur.type);
  if(last.model && last.model !== model) chips.push("最近请求 " + last.model);
  if(!chips.length) chips.push("默认供应商");
  $("hero-meta").innerHTML = chips.map((x) => "<span>" + esc(x) + "</span>").join("");
  const rate = (d.last && typeof d.last.hit_rate === "number") ? d.last.hit_rate : -1;
  $("ring-fg").setAttribute("stroke-dashoffset", String(314.16 * (1 - clamp(rate) / 100)));
  $("ring-num").textContent = rate >= 0 ? rate.toFixed(1) + "%" : "—";
  $("ring-side").innerHTML = rate >= 0
    ? "最近一次已完成请求<br>命中 <b style='color:#fff'>" + num(last.input_cached) + "</b> token<br>非缓存 <b style='color:#fff'>" + num(last.input_other) + "</b> token"
    : "暂无最近请求数据";
}

function renderTokens(d){
  const cells = [
    ["合计 Token", d.total, "输入 + 输出", ""],
    ["非缓存输入", d.input_other, "未命中缓存部分", "g"],
    ["缓存命中输入", d.input_cached, "已复用上下文", ""],
    ["输出", d.output, "模型生成", "y"]
  ];
  $("token-grid").innerHTML = cells.map(([lab, val, sub, c]) =>
    '<div class="tcell"><div class="lab"><i class="' + c + '"></i>' + lab + '</div>' +
    '<div class="num">' + num(val) + '</div><div class="sub">' + sub + '</div></div>'
  ).join("");
  const parts = [
    "已完成请求 <b>" + num(d.requests) + "</b> 次",
    "数据截至 <b>" + esc(d.as_of || "—") + "</b> UTC",
    "数据源 <b>" + (d.source === "supplement" ? "cost_control 补充库" : "主库 provider_stats（兜底）") + "</b>",
    "范围 <b>" + (d.scope === "session" ? "当前会话" : "全部会话") + "</b>"
  ];
  $("token-foot").innerHTML = parts.join("");
  $("win-hint").textContent = (WIN_LABEL[d.window] || d.window) + " · " + (d.since ? "自 " + d.since + " UTC" : "不限起点");
}

function renderCache(d){
  const r = typeof d.hit_rate === "number" ? d.hit_rate : -1;
  $("big-rate").innerHTML = (r >= 0 ? r.toFixed(1) : "—") + "<small>%</small>";
  $("slider-fill").style.width = clamp(r) + "%";
  const eff = d.effective_read, cc = d.cache_creation || 0;
  $("rate-side").innerHTML =
    "有效命中 <b>" + num(eff) + "</b> token<br>" +
    "缓存写入 <b>" + num(cc) + "</b> token<br>" +
    "逐条平均 <b>" + pct(d.hit_rate_avg) + "</b>";
  const rows = [
    ["最近一次请求命中率", pct(d.last && d.last.hit_rate), d.last && d.last.at],
    ["逐条平均命中率", pct(d.hit_rate_avg), "每条请求先算再平均"],
    ["口径", "max(cache_read, 缓存输入)", "避免 provider 回报 0 时低报"]
  ];
  $("mini-list").innerHTML = rows.map(([a,b,c]) =>
    '<div class="mini-row"><span class="r-lab">' + esc(a) + (c ? ' <span style="color:var(--text-3);font-size:11px">· ' + esc(c) + '</span>' : '') +
    '</span><span class="r-val">' + esc(b) + '</span></div>'
  ).join("");
  $("cache-note").textContent = d.note || "命中率 = 有效缓存命中输入 /(有效缓存命中输入 + 非缓存输入 + 缓存写入)。";
}

function renderRank(elId, arr){
  const el = $(elId);
  if(!arr || !arr.length){ el.innerHTML = '<div class="empty">本窗口暂无数据</div>'; return; }
  el.innerHTML = arr.map((x) =>
    '<div class="rank-row"><div class="rank-head">' +
      '<span class="rank-name" title="' + esc(x.name) + '">' + esc(x.name) + '</span>' +
      '<span class="rank-val">' + num(x.requests) + ' 次 · <b>' + pct(x.hit_rate) + '</b></span>' +
    '</div><div class="rank-bar"><i style="width:' + clamp(x.hit_rate) + '%"></i></div></div>'
  ).join("");
}

function renderTrend(d){
  const el = $("trend"), rows = d.timeline || [];
  if(!rows.length){ el.innerHTML = '<div class="empty">本窗口暂无趋势数据</div>'; return; }
  const W = 900, H = 190, left = 8, bottom = 26, top = 8;
  const bw = (W - left * 2) / rows.length;
  const max = Math.max.apply(null, rows.map((r) => Number(r.total) || 0).concat([1]));
  let bars = "";
  rows.forEach((r, i) => {
    const scale = (H - bottom - top) / max;
    const hAll = (Number(r.total) || 0) * scale;
    const hIo = (Number(r.input_other) || 0) * scale;
    const hIc = Math.max(0, hAll - hIo);
    const x = left + i * bw + bw * .18, w = Math.max(3, bw * .64);
    const yIo = H - bottom - hIo, yIc = yIo - hIc;
    bars += '<rect x="' + x.toFixed(1) + '" y="' + yIo.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0,hIo).toFixed(1) + '" rx="3" fill="var(--track)"><title>' + esc(r.date) + ' · 非缓存 ' + num(r.input_other) + '</title></rect>';
    bars += '<rect x="' + x.toFixed(1) + '" y="' + yIc.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0,hIc).toFixed(1) + '" rx="3" fill="var(--accent)"><title>' + esc(r.date) + ' · 命中 ' + num(r.input_cached) + ' · 命中率 ' + pct(r.hit_rate) + '</title></rect>';
    if(rows.length <= 8 || i % 2 === 0 || i === rows.length - 1){
      bars += '<text class="axis" x="' + (x + w/2).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + esc(String(r.date).slice(5)) + '</text>';
    }
  });
  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' + bars + '</svg>' +
    '<div class="legend"><span><i style="background:var(--track)"></i>非缓存输入</span>' +
    '<span><i style="background:var(--accent)"></i>缓存命中输入</span>' +
    '<span>共 ' + rows.length + ' 天 · 峰值 ' + num(max) + ' token / 天</span></div>';
}

function renderRecent(d){
  const el = $("recent"), rows = d.recent || [];
  $("recent-hint").textContent = "最近 " + rows.length + " 条已完成请求";
  if(!rows.length){ el.innerHTML = '<div class="empty">本窗口暂无请求记录</div>'; return; }
  el.innerHTML = rows.map((r) => {
    const rate = typeof r.hit_rate === "number" ? r.hit_rate : -1;
    const low = rate >= 0 && rate < 20;
    return '<div class="rec-row">' +
      '<span class="rec-time">' + esc(String(r.at || "").slice(0,19)) + '</span>' +
      '<span class="rec-model" title="' + esc(r.model) + '">' + esc(r.model) + '</span>' +
      '<span class="rec-tok">' + num(r.input_other + r.input_cached + r.output) + ' tok</span>' +
      '<span class="pill' + (low ? " low" : "") + '">' + pct(rate) + '</span>' +
    '</div>';
  }).join("");
}

function renderFooter(d, demo){
  $("footer").innerHTML =
    (demo ? '<div style="color:var(--warn);font-weight:600;margin-bottom:6px">当前展示的是内置演示数据（线上快照），未连接到插件接口。</div>' : '') +
    '数据源 <code>' + esc(d.source_detail || (d.source === "supplement" ? "supplement.db" : "provider_stats")) + '</code> · ' +

    '用量在每轮响应结束后才入库，<b>不含本轮</b>；命中率与 cost_control 的 /cache 面板同口径。页面每 60 秒自动刷新。';

function renderSessions(d){
  const sel = $("umo-select");
  const list = d.sessions || [];
  const cur = state.umo;
  sel.innerHTML = '<option value="">全部会话</option>' + list.map((s) =>
    '<option value="' + esc(s.umo) + '">' + esc(s.umo) + ' · ' + num(s.requests) + ' 次</option>'
  ).join("");
  sel.value = list.some((s) => s.umo === cur) ? cur : "";
  state.umo = sel.value;
}

async function load(){
  if(state.loading) return;
  state.loading = true;
  $("refresh-btn").classList.add("spin");
  try{
    const got = await fetchData();
    state.data = got.data; state.demo = got.demo;
    const d = got.data || {};
    if(!d.ok){
      setStatus("读取失败", "err");
      $("footer").innerHTML = '<span style="color:#ff5b5b">' + esc(d.error || "数据源不可用") + '</span>';
    }else{
      setStatus(got.demo ? "演示数据" : "已连接", got.demo ? "demo" : "");
      renderHero(d); renderTokens(d); renderCache(d);
      renderRank("by-model", d.by_model); renderRank("by-session", d.by_session);
      renderTrend(d); renderRecent(d); renderFooter(d, got.demo);
      renderSessions(d);
    }
  }catch(e){
    setStatus("读取失败", "err");
  }finally{
    state.loading = false;
    $("refresh-btn").classList.remove("spin");
  }
}

/* ---------- 交互 ---------- */
$("window-seg").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-w]");
  if(!b) return;
  document.querySelectorAll("#window-seg button").forEach((x) => x.classList.toggle("on", x === b));
  state.window = b.dataset.w;
  load();
});
$("umo-select").addEventListener("change", (e) => { state.umo = e.target.value; load(); });
$("refresh-btn").addEventListener("click", load);

const THEMES = ["auto", "light", "dark"];
let theme = localStorage.getItem("runtime_info_theme") || "auto";
function applyTheme(){
  if(theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  $("theme-btn").title = "主题：" + ({auto:"跟随系统",light:"浅色",dark:"深色"}[theme]);
  localStorage.setItem("runtime_info_theme", theme);
}
$("theme-btn").addEventListener("click", () => { theme = THEMES[(THEMES.indexOf(theme) + 1) % 3]; applyTheme(); });
applyTheme();

load();
setInterval(load, 60000);
</script>
</body>
</html>
